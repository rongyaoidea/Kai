name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' was removed from the SDK repository; requesting it fails the
          # step (sdkmanager exit 1). platform-tools is all CI needs explicitly —
          # AGP auto-downloads the compileSdk/build-tools it builds against.
          packages: platform-tools
      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > /tmp/release.keystore
      - name: Build and sign APK
        # The release build config in androidApp/build.gradle.kts already picks
        # the release signingConfig when KEYSTORE_FILE is set, so Gradle signs
        # AND zipaligns the APK itself — no third-party signing action (which
        # also dragged in build-tools 29 just to reach zipalign).
        run: bash ./gradlew :androidApp:assembleFossRelease --stacktrace
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk

  play-store:
    name: Upload AAB to Play Store
    # Disabled until the repo carries PLAY_STORE_* secrets: a reusable-workflow
    # job cannot use continue-on-error, so an unconfigured call would fail every
    # tag run. Add the secrets and set the repository variable
    # PLAY_STORE_UPLOAD=true to bring store uploads back into the release.
    if: ${{ vars.PLAY_STORE_UPLOAD == 'true' }}
    uses: ./.github/workflows/play-store.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit

  release:
    name: Release APK
    needs: [apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: signed-apk

      - name: List downloaded files (for debugging)
        run: ls -la

      - name: Rename assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv androidApp-foss-release.apk "Kai-${VERSION}-android.apk"

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          # Fallback if CHANGELOG.md missing or section empty
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${GITHUB_REF_NAME}" > changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --no-merges > changelog.txt
            fi
          fi

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          files: Kai-*
