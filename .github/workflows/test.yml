name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A newer commit supersedes whatever an in-flight run was about to report, so
# PR runs are cancelled rather than queued. main pushes are never cancelled:
# that build is the one branch protection waits on.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' was removed from the SDK repository; requesting it fails the
          # step (sdkmanager exit 1). platform-tools is all CI needs explicitly —
          # AGP auto-downloads the compileSdk/build-tools it builds against.
          packages: platform-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Replaces the hand-rolled actions/cache block, which only covered the
      # wrapper distribution. setup-gradle also caches the dependency store and
      # the task-output cache, and reports step timings.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the task-output cache is dropped. A poisoned entry there once
      # shadowed newly added compose resources and cost more debugging time
      # than a re-render ever will — but ~/.gradle/caches also holds the
      # content-addressed dependency store, which was never the culprit. This
      # step used to `rm -rf ~/.gradle/caches`, paying a full dependency
      # re-download on every run to guard a problem that only ever lived in
      # this one subdirectory.
      - name: Drop cached task outputs for hermetic builds
        run: rm -rf ~/.gradle/caches/build-cache-1

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version

      # Kept in its own invocation on purpose. spotlessApply rewrites .kt files
      # in place, and org.gradle.parallel=true would otherwise let it race the
      # Kotlin compiler reading those same files. Every invocation below reuses
      # the daemon this one starts, so the split costs seconds rather than a
      # cold JVM per step.
      - name: Run spotlessApply
        run: ./gradlew spotlessApply --stacktrace

      # One invocation for both. These used to be two separate --no-daemon runs,
      # each paying for a cold JVM, a cold Kotlin daemon and a fresh round of
      # project configuration.
      #
      #   desktopTest — the shared module's unit tests (JVM).
      #   assembleFossDebug — desktopTest compiles the shared module for the JVM
      #     only, so nothing here would catch an error in androidMain. This
      #     compiles androidMain and the app module without signing or
      #     publishing anything.
      - name: Run unit tests and build the Android debug variant
        run: ./gradlew --stacktrace :composeApp:desktopTest :androidApp:assembleFossDebug

      # Deliberately a separate step. Both targets below were previously
      # compiled by *no* workflow, so their task names are newer than the rest
      # of this file and are the most likely thing here to need a one-word fix.
      # Isolating them keeps such a failure from also masking the test results
      # above.
      #
      # compileKotlinWasmJs — wasmJsMain (23 files) was never compiled anywhere,
      # so an expect/actual signature change broke the Web build silently.
      #
      # :screenshotTests:compileDebugUnitTestKotlin — this replaces the
      # :screenshotTests:updateScreenshots call that used to sit here. That call
      # was dead weight: it recorded Paparazzi goldens into
      # src/test/snapshots/images, which .gitignore excludes and which has never
      # been tracked (0 files, in this repo and in every commit that ever
      # touched it). The drift check below could therefore never observe a
      # screenshot difference — it only ever caught formatting, while paying for
      # a full render of the suite on every run. Compiling the test sources
      # keeps the module from rotting at a fraction of the cost.
      - name: Compile the Wasm and screenshot-test targets
        run: ./gradlew --stacktrace :composeApp:compileKotlinWasmJs :screenshotTests:compileDebugUnitTestKotlin

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # No auto-fix push: formatting drift fails the run and the author re-runs
      # the command locally. Auto-commits cost extra minutes and bury real
      # changes under bot commits.
      - name: Fail on formatting drift
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "::error::spotlessApply produced changes."
          echo "Run locally and push the result:"
          echo "  ./gradlew spotlessApply"
          git status --porcelain
          git diff --binary > drift.patch
          exit 1

      # Read-only: nothing is committed. Uploaded so the author can apply the
      # patch without a JVM at hand: gh run download <id> -n drift-patch
      # then `git apply drift.patch`.
      - name: Upload drift patch
        if: failure() && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-patch
          path: drift.patch

      # Non-blocking on purpose. values/strings.xml is the source of truth and
      # every locale falls back to it for keys it lacks, so a missing key ships
      # as English rather than as a build failure. 69 of 579 keys are currently
      # untranslated in de/ja and most other locales — clustered in the features
      # added over the last few releases (tool approval, tool call cards, the
      # automation section, MCP marketplaces, max tool steps).
      #
      # This warns rather than fails so the existing backlog does not turn every
      # run red on day one. Once the backlog is cleared, flip warn -> error.
      - name: Warn on untranslated string keys
        run: |
          res=composeApp/src/commonMain/composeResources
          grep -o 'name="[^"]*"' "$res/values/strings.xml" | sort -u > /tmp/base.keys
          missing=0
          for f in "$res"/values-*/strings.xml; do
            grep -o 'name="[^"]*"' "$f" | sort -u > /tmp/loc.keys
            n=$(comm -23 /tmp/base.keys /tmp/loc.keys | wc -l)
            if [ "$n" -gt 0 ]; then
              echo "::warning file=$f::$n key(s) fall back to English"
              missing=$((missing + n))
            fi
          done
          echo "Total untranslated: $missing (baseline 0, currently backlogged)"
