name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Drop cached Gradle state for hermetic builds
        # Only ~/.gradle/wrapper is restored above. Everything under
        # ~/.gradle/caches (dependency jars, task outputs, Kotlin incremental
        # state) is rebuilt: a poisoned cache entry once shadowed newly added
        # compose resources for several runs and cost more debugging time than
        # re-downloads ever will.
        run: rm -rf ~/.gradle/caches

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version

      - name: Run spotlessApply
        run: ./gradlew spotlessApply --no-daemon --stacktrace

      - name: Run updateScreenshots
        run: ./gradlew :screenshotTests:updateScreenshots --no-daemon --stacktrace

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # No auto-fix push: formatting/screenshot drift fails the run and the
      # author re-runs the commands locally. Auto-commits cost extra minutes
      # and bury real changes under bot commits.
      - name: Fail on formatting or screenshot drift
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "::error::spotlessApply or updateScreenshots produced changes."
          echo "Run locally and push the result:"
          echo "  ./gradlew spotlessApply"
          echo "  ./gradlew :screenshotTests:updateScreenshots"
          git status --porcelain
          git diff --binary > drift.patch
          exit 1

      # The patch (including binary screenshots) is uploaded so the author can
      # apply it without a JVM at hand: gh run download <id> -n drift-patch
      # then `git apply drift.patch`. Read-only: nothing is committed.
      - name: Upload drift patch
        if: failure() && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-patch
          path: drift.patch
